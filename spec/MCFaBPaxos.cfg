SPECIFICATION Spec

\* Constants declared as model values  so SYMMETRY works.
\* None and NoValue are also model values, distinct from value tuples, so TLC
\* equality between them and (Value \X PN) returns FALSE without type errors.
\* Full per-class Byzantine threat: one Byzantine acceptor, proposer, learner.
CONSTANTS
  Acceptors    = {a1, a2, a3, a4, a5, a6}
  Proposers    = {p1, p2, p3, p4}
  Learners     = {l1, l2, l3, l4}
  ByzAcceptors = {a1}
  ByzProposers = {p1}
  ByzLearners  = {l1}
  Value        = {v0, v1}
  MaxPN        = 1
  F            = 1
  None         = NoneVal
  NoValue      = NoValueVal

INVARIANTS
  TypeOK
  CS1Inv
  CS2Inv
  CS3Inv

CONSTRAINT StateConstraint

SYMMETRY Symmetry
