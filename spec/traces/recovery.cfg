\* Recovery trace: all agents correct, one value, two terms. The observer
\* NeverLearnedAtPN1 forces TLC to print the shortest run in which a learner
\* decides at proposal number 1. Proposal number 1 is reachable only through a
\* LeaderChange, so the run exercises the full recovery path: suspect the
\* leader, change leader, query, replies, propose with a progress certificate,
\* accept, learn.
SPECIFICATION Spec

INVARIANT NeverLearnedAtPN1

CONSTANTS
  Acceptors    = {a1, a2, a3, a4, a5, a6}
  ByzAcceptors = {}
  Proposers    = {p1, p2, p3, p4}
  ByzProposers = {}
  Learners     = {l1, l2, l3, l4}
  ByzLearners  = {}
  Value        = {v0}
  MaxPN        = 1
  F            = 1
  None         = NoneVal
  NoValue      = NoValueVal
