\* Common-case trace: all agents correct, one value, one term. The observer
\* NeverLearned forces TLC to print the shortest run in which a learner decides:
\* propose, an acceptor quorum, learn. No recovery, no Byzantine noise.
SPECIFICATION Spec

INVARIANT NeverLearned

CONSTANTS
  Acceptors    = {a1, a2, a3, a4, a5, a6}
  ByzAcceptors = {}
  Proposers    = {p1, p2, p3, p4}
  ByzProposers = {}
  Learners     = {l1, l2, l3, l4}
  ByzLearners  = {}
  Value        = {v0}
  MaxPN        = 1
  F            = 1
  None         = NoneVal
  NoValue      = NoValueVal
