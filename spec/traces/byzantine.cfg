\* Byzantine-tolerated trace: one Byzantine acceptor (a1), two values, one term.
\* The Byzantine baseline injects a1's conflicting ACCEPTED for both values from
\* the start. The observer NeverLearned forces TLC to print the shortest run in
\* which a learner decides; the run shows a correct acceptor quorum deciding the
\* leader's value while a1's conflicting vote does not form a quorum, that is,
\* the fault is tolerated.
SPECIFICATION Spec

INVARIANT NeverLearned

CONSTANTS
  Acceptors    = {a1, a2, a3, a4, a5, a6}
  ByzAcceptors = {a1}
  Proposers    = {p1, p2, p3, p4}
  ByzProposers = {}
  Learners     = {l1, l2, l3, l4}
  ByzLearners  = {}
  Value        = {v0, v1}
  MaxPN        = 1
  F            = 1
  None         = NoneVal
  NoValue      = NoValueVal
