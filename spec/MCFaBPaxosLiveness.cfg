SPECIFICATION LiveSpec

\* Liveness properties: CL1 (some value eventually chosen), CL2 (a chosen value
\* is eventually learned by every correct learner).
PROPERTIES
  CL1
  CL2

INVARIANT TypeOK

CONSTANTS
  Acceptors    = {a1, a2, a3, a4, a5, a6}
  ByzAcceptors = {a1}
  Proposers    = {p1, p2, p3, p4}
  ByzProposers = {}
  Learners     = {l1, l2, l3, l4}
  ByzLearners  = {l1}
  Value        = {v0}
  MaxPN        = 1
  F            = 1
  None         = NoneVal
  NoValue      = NoValueVal

\* No SYMMETRY: TLC symmetry is unsound for liveness (it can miss a counterexample).
\* No CONSTRAINT: a state constraint can hide a liveness counterexample.
