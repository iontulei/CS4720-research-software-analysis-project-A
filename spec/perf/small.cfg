\* E5: small config (single value, no Byzantine, symmetry on) used to compare
\* worker counts. Small enough that the single-worker run finishes inside the
\* cap, so we get a clean wall-clock ratio. State count is the same for any
\* worker count; only runtime differs.
SPECIFICATION Spec
CONSTANTS
  Acceptors    = {a1, a2, a3, a4, a5, a6}
  Proposers    = {p1, p2, p3, p4}
  Learners     = {l1, l2, l3, l4}
  ByzAcceptors = {}
  ByzProposers = {}
  ByzLearners  = {}
  Value        = {v0}
  MaxPN        = 1
  F            = 1
  None         = NoneVal
  NoValue      = NoValueVal
INVARIANTS
  TypeOK
  CS1Inv
  CS2Inv
  CS3Inv
CONSTRAINT StateConstraint
SYMMETRY Symmetry
