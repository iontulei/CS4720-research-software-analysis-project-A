\* E3: one Byzantine acceptor only, proposers and learners correct (else
\* baseline). Isolates the cost of a single adversary class.
SPECIFICATION Spec
CONSTANTS
  Acceptors    = {a1, a2, a3, a4, a5, a6}
  Proposers    = {p1, p2, p3, p4}
  Learners     = {l1, l2, l3, l4}
  ByzAcceptors = {a1}
  ByzProposers = {}
  ByzLearners  = {}
  Value        = {v0, v1}
  MaxPN        = 1
  F            = 1
  None         = NoneVal
  NoValue      = NoValueVal
INVARIANTS
  TypeOK
  CS1Inv
  CS2Inv
  CS3Inv
CONSTRAINT StateConstraint
SYMMETRY Symmetry
